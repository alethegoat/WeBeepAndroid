# Applied on top of detekt's default config (buildUponDefaultConfig = true).
# Overrides tuned for Jetpack Compose / Android conventions; detekt is blocking in CI.

naming:
  FunctionNaming:
    ignoreAnnotated:
      - 'Composable'
  TopLevelPropertyNaming:
    constantPattern: '[A-Z][_A-Za-z0-9]*'
  # Compose files are named after their main composable or theme role
  # (e.g. Motion.kt, Spacing.kt), not after the first declared class.
  MatchingDeclarationName:
    active: false

complexity:
  LongParameterList:
    # Hilt constructors and @Provides functions take one parameter per dependency.
    functionThreshold: 8
    constructorThreshold: 10
    ignoreDefaultParameters: true
    ignoreAnnotated:
      - 'Composable'
  LongMethod:
    ignoreAnnotated:
      - 'Composable'
  CyclomaticComplexMethod:
    ignoreSimpleWhenEntries: true
    ignoreAnnotated:
      - 'Composable'
  TooManyFunctions:
    ignorePrivate: true
    thresholdInClasses: 15
    thresholdInInterfaces: 15

style:
  MaxLineLength:
    maxLineLength: 140
  ReturnCount:
    max: 4
    excludeGuardClauses: true
  ThrowsCount:
    max: 3
    excludeGuardClauses: true
  MagicNumber:
    ignorePropertyDeclaration: true
    ignoreCompanionObjectPropertyDeclaration: true
    ignoreNamedArgument: true
    # 100 is the download-progress 'done' percentage; ranges such as 500..599 read clearly.
    ignoreNumbers:
      - '-1'
      - '0'
      - '1'
      - '2'
      - '100'
    ignoreRanges: true
    ignoreAnnotated:
      - 'Composable'
      - 'Preview'
  UnusedPrivateMember:
    ignoreAnnotated:
      - 'Preview'
  ForbiddenComment:
    active: false

# KDoc is enforced only where the contract matters: domain and data code plus the non-UI core
# packages (common, network, datastore, session, storage). Presentation, Compose UI and the
# database/DI wiring are excluded: composables and entities are self-describing and documented
# by hand only where non-obvious. Overrides need no KDoc (the interface documents the contract).
comments:
  UndocumentedPublicClass:
    active: true
    includes: &documentedScope
      - '**/domain/**'
      - '**/data/**'
      - '**/core/common/**'
      - '**/core/network/**'
      - '**/core/datastore/**'
      - '**/core/session/**'
      - '**/core/storage/**'
    excludes: &testSources
      - '**/test/**'
      - '**/androidTest/**'
      - '**/testFixtures/**'
  UndocumentedPublicFunction:
    active: true
    includes: *documentedScope
    excludes: *testSources
  # Left off: it demands a @property tag for every constructor field, which for DTOs mirroring Moodle's
  # wire names and for plain domain models only invites paraphrase. Fields are documented where they
  # carry a constraint (@property on the class) and left to the type KDoc otherwise.
  UndocumentedPublicProperty:
    active: false

exceptions:
  # `catch (e: Exception) { if (e is CancellationException) throw e ... }` is the
  # deliberate coroutine-safe pattern used at IO/UI boundaries in this codebase.
  TooGenericExceptionCaught:
    active: false
  InstanceOfCheckForException:
    active: false

# io.nlopez.compose.rules (detekt plugin).
Compose:
  ComposableAnnotationNaming:
    active: true
  ComposableNaming:
    active: true
  ComposableParamOrder:
    active: true
  CompositionLocalAllowlist:
    active: true
  CompositionLocalNaming:
    active: true
  ContentEmitterReturningValues:
    active: true
  ContentTrailingLambda:
    active: true
  ContentSlotReused:
    active: true
  DefaultsVisibility:
    active: true
  LambdaParameterEventTrailing:
    active: true
  LambdaParameterInRestartableEffect:
    active: true
  Material2:
    # The app is Material 3 only; flag accidental M2 imports.
    active: true
  ModifierClickableOrder:
    active: true
  ModifierComposable:
    active: true
  ModifierComposed:
    active: true
  ModifierMissing:
    active: true
  ModifierNaming:
    active: true
  ModifierNotUsedAtRoot:
    active: true
  ModifierReused:
    active: true
  ModifierWithoutDefault:
    active: true
  MultipleEmitters:
    active: true
  MutableParams:
    active: true
  MutableStateAutoboxing:
    active: true
  MutableStateParam:
    active: true
  ParameterNaming:
    active: true
  PreviewAnnotationNaming:
    active: true
  PreviewPublic:
    active: true
  RememberMissing:
    active: true
  RememberContentMissing:
    active: true
  UnstableCollections:
    # Noisy until the Compose compiler's strong skipping makes it moot; revisit with stability work.
    active: false
  ViewModelForwarding:
    active: true
  ViewModelInjection:
    active: true
