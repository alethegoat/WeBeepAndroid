# Applied on top of detekt's default config (buildUponDefaultConfig = true).
# Only overrides that match Jetpack Compose conventions live here.

naming:
  FunctionNaming:
    ignoreAnnotated:
      - 'Composable'
  TopLevelPropertyNaming:
    constantPattern: '[A-Z][A-Za-z0-9]*'

complexity:
  LongParameterList:
    ignoreDefaultParameters: true
    ignoreAnnotated:
      - 'Composable'
  LongMethod:
    ignoreAnnotated:
      - 'Composable'
  TooManyFunctions:
    ignorePrivate: true

style:
  MagicNumber:
    ignorePropertyDeclaration: true
    ignoreCompanionObjectPropertyDeclaration: true
    ignoreAnnotated:
      - 'Composable'
      - 'Preview'
  UnusedPrivateMember:
    ignoreAnnotated:
      - 'Preview'
  ForbiddenComment:
    active: false
