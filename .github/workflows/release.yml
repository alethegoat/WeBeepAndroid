name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build the release for, e.g. v1.1.0"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}
          # The build runs with signing secrets: keep the GitHub token out of .git/config.
          persist-credentials: false

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 17
          # No Gradle cache: a signed release must not restore state written by other runs.

      - name: Resolve the tag and check it against versionName
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            TAG="$INPUT_TAG"
          else
            TAG="$GITHUB_REF_NAME"
          fi
          # Strict format before the value reaches GITHUB_ENV or any command line.
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Tag must look like v1.2.3"
            exit 1
          fi
          VERSION_NAME=$(sed -nE 's/^[[:space:]]*versionName[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' app/build.gradle.kts | head -n1)
          if [ -z "$VERSION_NAME" ]; then
            echo "::error::Could not read versionName from app/build.gradle.kts"
            exit 1
          fi
          if [ "${TAG#v}" != "$VERSION_NAME" ]; then
            echo "::error::Tag $TAG does not match versionName $VERSION_NAME in app/build.gradle.kts. Bump versionName or tag v$VERSION_NAME."
            exit 1
          fi
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"

      - name: Decode the release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          # Fail early: a missing secret must never fall back to a debug-signed release.
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            eval "value=\${$name}"
            if [ -z "$value" ]; then
              echo "::error::Repository secret $name is empty or missing"
              exit 1
            fi
          done
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"

      - name: Build signed release APK and AAB
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease :app:bundleRelease --no-daemon

      - name: Verify the APK signature
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -n1)
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n1)
          "$BUILD_TOOLS/apksigner" verify --print-certs "$APK" > "$RUNNER_TEMP/certs.txt"
          # Refuse to publish a debug-signed release.
          if grep -q "CN=Android Debug" "$RUNNER_TEMP/certs.txt"; then
            echo "::error::The APK is signed with the Android debug key, refusing to publish"
            exit 1
          fi
          # Only the public certificate digest is printed.
          CERT_SHA256=$(grep -m1 'certificate SHA-256 digest' "$RUNNER_TEMP/certs.txt" | sed 's/.*: //')
          if [ -z "$CERT_SHA256" ]; then
            echo "::error::No certificate SHA-256 digest found in apksigner output"
            exit 1
          fi
          echo "Signing certificate SHA-256: $CERT_SHA256"
          echo "CERT_SHA256=$CERT_SHA256" >> "$GITHUB_ENV"

      - name: Prepare release files
        run: |
          mkdir release
          cp app/build/outputs/apk/release/*.apk "release/WeBeep-${TAG}.apk"
          cp app/build/outputs/bundle/release/*.aab "release/WeBeep-${TAG}.aab"
          (cd release && sha256sum "WeBeep-${TAG}.apk" "WeBeep-${TAG}.aab" > SHA256SUMS.txt)
          cat release/SHA256SUMS.txt

      - name: Write release notes
        run: |
          # Section body of this version: between its heading and the next one.
          awk -v ver="$VERSION_NAME" '
            /^## \[/ { if (found) exit; if (index($0, "## [" ver "]") == 1) { found = 1 } ; next }
            found { print }
          ' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::error::No CHANGELOG.md section found for $VERSION_NAME"
            exit 1
          fi
          {
            echo
            echo "### Verify"
            echo
            echo "Signing certificate SHA-256: \`$CERT_SHA256\`"
            echo
            echo "The APK installs as \`io.github.alethegoat.webeep\`. It cannot update a debug build, because the signature differs: uninstall the debug build first."
          } >> notes.md

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FILES=("release/WeBeep-${TAG}.apk" "release/WeBeep-${TAG}.aab" release/SHA256SUMS.txt)
          if gh release view "$TAG" > /dev/null 2>&1; then
            # Re-run for an existing tag: replace assets and notes.
            gh release upload "$TAG" "${FILES[@]}" --clobber
            gh release edit "$TAG" --title "WeBeep $TAG" --notes-file notes.md
          else
            gh release create "$TAG" "${FILES[@]}" \
              --title "WeBeep $TAG" \
              --notes-file notes.md \
              --verify-tag
          fi

      - name: Delete the keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
