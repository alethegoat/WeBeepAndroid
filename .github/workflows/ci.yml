name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Lint debug
        run: ./gradlew :app:lintDebug --no-daemon

      - name: Static analysis (detekt)
        run: ./gradlew :app:detekt --no-daemon

      - name: Code style (ktlint; report-only)
        continue-on-error: true
        run: ./gradlew :app:ktlintCheck --no-daemon

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Run unit tests with coverage
        run: ./gradlew test :app:koverXmlReportDebug --no-daemon

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: reports
          path: |
            app/build/reports/detekt/
            app/build/reports/ktlint/
            app/build/reports/kover/
            app/build/reports/tests/
          if-no-files-found: ignore

      - name: Verify release build (R8, debug-signed smoke only)
        env:
          ALLOW_DEBUG_RELEASE_SIGNING: "true"
        run: ./gradlew :app:assembleRelease --no-daemon
