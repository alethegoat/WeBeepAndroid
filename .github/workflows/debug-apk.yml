name: Debug APK

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: debug-apk
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Publish as the debug-latest pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk WeBeep-debug.apk
          gh release delete debug-latest --yes --cleanup-tag || true
          gh release create debug-latest WeBeep-debug.apk \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "WeBeep debug (latest master, developer build)" \
            --notes "Developer build of ${GITHUB_SHA}, signed with a publicly known debug key. For development and testing only. To use the app, install the signed APK from the latest versioned release instead: https://github.com/alethegoat/WeBeepAndroid/releases/latest"
