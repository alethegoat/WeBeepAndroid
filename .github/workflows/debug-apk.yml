name: Debug APK

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: debug-apk
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Publish as the debug-latest pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk WeBeep-debug.apk
          gh release delete debug-latest --yes --cleanup-tag || true
          gh release create debug-latest WeBeep-debug.apk \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "WeBeep debug (latest master)" \
            --notes "Debug build of ${GITHUB_SHA}. Install WeBeep-debug.apk directly on the phone."
