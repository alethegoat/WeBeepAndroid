version: 2
updates:
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 10
    ignore:
      # Major upgrades need a dedicated migration.
      - dependency-name: "com.squareup.okhttp3:*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "io.coil-kt:*"
        update-types: ["version-update:semver-major"]
      # 0.5+ targets detekt 2; stay on 0.4.x until detekt itself is migrated.
      - dependency-name: "io.nlopez.compose.rules:detekt"
        versions: [">= 0.5.0"]
    groups:
      androidx:
        patterns:
          - "androidx.*"
      kotlin:
        patterns:
          - "org.jetbrains.kotlin*"
          - "com.google.devtools.ksp"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
